[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carburant"
version = "0.1.0"
description = "Fuel-price data platform (ELT, star schema, dbt quality tests), anomaly detection and a RAG agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "lxml>=5",
    "duckdb>=1.1",
    "dbt-duckdb>=1.8",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "langgraph>=1.0",
    "snowballstemmer>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
gcp = ["google-cloud-storage>=2.16", "google-cloud-bigquery>=3.20", "dbt-bigquery>=1.8"]

[project.scripts]
carburant = "carburant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carburant = ["docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["dbt"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
